[project]
name = "s3-manager"
version = "0.1.0"
description = "A simple CLI tool for working with S3-compatible storage."
authors = [
    {name = "Beka Lomsadze",email = "blomsadze@orbitalgaming.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3 (>=1.43.108,<2.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "typer (>=0.27.2,<0.28.0)",
    "requests (>=2.34.2,<3.0.0)",
    "python-magic (>=0.4.27,<0.5.0)"
]

[project.scripts]
s3-manager = "s3_manager.cli:main"

[tool.poetry]
packages = [{include = "s3_manager", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
